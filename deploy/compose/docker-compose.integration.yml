# Stack completo a partir das imagens JÁ PUBLICADAS, para o teste de
# integração rodar contra exatamente o que vai para o cluster — não contra
# código montado por volume, nem contra imagem construída na hora.
#
# É a diferença essencial deste compose em relação ao docker-compose.yml da
# raiz (que é o ambiente de desenvolvimento, com bind mount e pip install no
# start): aqui a unidade de teste é a IMAGEM, com a mesma tag que o manifest
# do k8s vai deployar.
#
# As tags vêm do ambiente, uma por serviço, para o CI poder testar a
# combinação exata que está sendo promovida:
#   USER_SESSION_TAG=v2.0.0 GAME_CORE_TAG=v2.0.0 FRONT_END_TAG=v2.0.4 \
#     docker compose -f deploy/compose/docker-compose.integration.yml up -d
#
# Um Postgres com dois bancos (um por serviço), espelhando o que
# manifests/10-postgres.yaml faz no cluster — ADR-0009 no nível lógico.

name: pong-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: postgres
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # noeviction de propósito: é onde vivem as filas de criação de partida.
    # allkeys-lru aqui apagaria partida sob pressão de memória.
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  user-session-migrate:
    image: ghcr.io/davypaulino/pong-user-session:${USER_SESSION_TAG:?defina USER_SESSION_TAG}
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &user_session_env
      DB_NAME: usersession
      DB_USER: usersession
      DB_PASSWORD: usersession
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SECRET_KEY: integration-only-nao-e-real
      JWT_SIGNING_KEY: integration-only-nao-e-real
    depends_on:
      postgres:
        condition: service_healthy

  game-core-migrate:
    image: ghcr.io/davypaulino/pong-game-core:${GAME_CORE_TAG:?defina GAME_CORE_TAG}
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &game_core_env
      DB_NAME: gamecore
      DB_USER: gamecore
      DB_PASSWORD: gamecore
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy

  user-session:
    image: ghcr.io/davypaulino/pong-user-session:${USER_SESSION_TAG}
    environment: *user_session_env
    ports:
      - "18002:8002"
    healthcheck:
      # O legado não tem /healthz (tarefa TK.1) — usa uma rota real de
      # leitura, que também prova que o Django alcança o Postgres.
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/user-session/rooms/')"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      user-session-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  game-core:
    image: ghcr.io/davypaulino/pong-game-core:${GAME_CORE_TAG}
    environment: *game_core_env
    ports:
      - "18001:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/game-core/games/ranking/')"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      game-core-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Os dois workers são singletons, como no cluster (manifests/40-workers.yaml):
  # guardam estado em memória e dão LPOP na mesma fila Redis. Duas réplicas
  # consumiriam a mesma fila sem coordenação.
  game-worker:
    image: ghcr.io/davypaulino/pong-game-core:${GAME_CORE_TAG}
    command: ["python", "manage.py", "session_worker"]
    environment: *game_core_env
    depends_on:
      game-core:
        condition: service_healthy

  session-worker:
    image: ghcr.io/davypaulino/pong-user-session:${USER_SESSION_TAG}
    command: ["python", "manage.py", "game_integration"]
    environment: *user_session_env
    depends_on:
      user-session:
        condition: service_healthy

  front-end:
    image: ghcr.io/davypaulino/pong-front-end:${FRONT_END_TAG:?defina FRONT_END_TAG}
    volumes:
      - ./front-end-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
