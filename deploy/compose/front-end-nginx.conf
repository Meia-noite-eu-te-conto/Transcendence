# Espelha o ConfigMap front-end-nginx (manifests/01-configmap.yaml), com uma
# diferença necessária: aqui o nginx TAMBÉM faz proxy das APIs, porque no
# cluster esse papel é do Ingress, que não existe no compose.
#
# `=404` e não fallback para /index.html: o roteador da SPA nunca muda a URL,
# então fallback mascararia asset ausente (o erro apareceria como falha de
# parse de JavaScript em vez de 404).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/v1/user-session/ {
        proxy_pass http://user-session:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/game-core/ {
        proxy_pass http://game-core:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
