# Migrations como Job, não como initContainer da API: rodar `migrate` em cada réplica
# que sobe é desperdício na melhor hipótese e corrida na pior.
#
# Anotados como hook PreSync do Argo CD. Isso resolve duas coisas ao mesmo tempo:
#  · Job é imutável — sem hook, o segundo sync falharia com "field is immutable",
#    porque o Argo tentaria atualizar um Job existente em vez de recriá-lo;
#  · migration precisa rodar ANTES dos Deployments subirem com a imagem nova.
# `BeforeHookCreation` apaga o Job da execução anterior antes de criar o novo.
#
# Aplicando à mão (sem Argo), apague o Job antes de reaplicar:
#   kubectl delete job -n pong migrate-user-session migrate-game-core
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-user-session
  namespace: pong
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: github-registry
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U usersession; do
                echo "aguardando postgres..."; sleep 2
              done
          envFrom:
            - configMapRef: { name: pong-config }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: migrate
          image: ghcr.io/davypaulino/pong-user-session:v2.0.0
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: pong-config, key: USER_SESSION_DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: pong-config, key: USER_SESSION_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pong-secrets, key: USER_SESSION_DB_PASSWORD } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: pong-secrets, key: USER_SESSION_SECRET_KEY } }
            - name: JWT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: pong-secrets, key: JWT_SIGNING_KEY } }
          envFrom:
            - configMapRef: { name: pong-config }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
---
