# Uma instância de Postgres com DOIS bancos e DOIS usuários, um por serviço.
# Isso cumpre o "um banco por serviço" (ADR-0009) no nível lógico: o usuário
# `usersession` não tem permissão no banco `gamecore` e vice-versa.
# Duas instâncias separadas dariam isolamento mais forte, mas custam ~256 MiB de
# request a mais num cluster onde a memória é o recurso escasso (decisão D6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: pong
data:
  # Roda uma única vez, no primeiro boot, quando o PGDATA está vazio.
  01-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-SQL
      CREATE USER usersession WITH PASSWORD '${USER_SESSION_DB_PASSWORD}';
      CREATE DATABASE usersession OWNER usersession;
      REVOKE ALL ON DATABASE usersession FROM PUBLIC;

      CREATE USER gamecore WITH PASSWORD '${GAME_CORE_DB_PASSWORD}';
      CREATE DATABASE gamecore OWNER gamecore;
      REVOKE ALL ON DATABASE gamecore FROM PUBLIC;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pong
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pong
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pong-secrets, key: POSTGRES_PASSWORD }
            - name: USER_SESSION_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pong-secrets, key: USER_SESSION_DB_PASSWORD }
            - name: GAME_CORE_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pong-secrets, key: GAME_CORE_DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 493   # 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
