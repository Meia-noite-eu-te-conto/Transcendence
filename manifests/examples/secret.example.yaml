# TEMPLATE. Não commite o Secret preenchido.
#
# Crie assim, a partir do seu .env.local:
#
#   kubectl create secret generic pong-secrets -n pong \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=USER_SESSION_DB_PASSWORD='...' \
#     --from-literal=GAME_CORE_DB_PASSWORD='...' \
#     --from-literal=USER_SESSION_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=GAME_CORE_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=JWT_SIGNING_KEY='...'
#
# JWT_SIGNING_KEY é exigido pelo User-Session (SIMPLE_JWT em settings.py, HS256).
# Hoje ele está num src/.env COMMITADO no repositório do User-Session — trate o valor
# como vazado e gere outro. Sem ele, SIGNING_KEY vira "" e a validação de token aceita
# o que não deve.
#
# As SECRET_KEY do Django estão hoje FIXAS no settings.py dos dois serviços
# (e o .env do repositório está commitado com as senhas do Postgres).
# Gere valores novos — os antigos devem ser considerados vazados. Ver ADR-0007.
#
# O secret de pull de imagem é namespaced e hoje só existe em `prod`.
# Copie para `pong`:
#
#   kubectl get secret github-registry -n prod -o yaml \
#     | sed 's/namespace: prod/namespace: pong/' \
#     | grep -v '^\s*\(uid\|resourceVersion\|creationTimestamp\|selfLink\):' \
#     | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: pong-secrets
  namespace: pong
type: Opaque
stringData:
  POSTGRES_PASSWORD: "TROCAR"
  USER_SESSION_DB_PASSWORD: "TROCAR"
  GAME_CORE_DB_PASSWORD: "TROCAR"
  USER_SESSION_SECRET_KEY: "TROCAR"
  GAME_CORE_SECRET_KEY: "TROCAR"
  JWT_SIGNING_KEY: "TROCAR"
