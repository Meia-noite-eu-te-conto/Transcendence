# Roteamento por caminho, direto para cada Service. O nginx do pod de front-end
# serve só estáticos — o proxy das APIs, que no docker-compose era feito pelo
# default.conf, passa a ser declarado aqui.
#
# NÃO use `rewrite-target: /` (como faz prod/routine-ingress): o Django espera o
# caminho completo (`/api/v1/user-session/rooms/`). Reescrever para `/` devolve 404
# em tudo.
#
# WebSocket: o ingress-nginx faz o upgrade sozinho ao ver o header, então não há
# annotation de upgrade. Mas o timeout padrão de 60 s DERRUBA conexão ociosa — daí
# os proxy-*-timeout abaixo. E não é preciso sessão fixa: o channel layer do
# Channels usa Redis, então qualquer pod atende qualquer conexão.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pong
  namespace: pong
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  # TLS: o jogo usa wss://, então não é opcional. Decisão D7 em aberto — reaproveitar
  # o secret `certificado-tls` de prod, gerar um autoassinado para este namespace, ou
  # instalar cert-manager. Descomente quando o secret existir em `pong`.
  # tls:
  #   - hosts: [pong.homelab]
  #     secretName: certificado-tls
  rules:
    - host: pong.homelab
      http:
        paths:
          - path: /api/v1/user-session
            pathType: Prefix
            backend:
              service:
                name: user-session
                port: { number: 8002 }
          - path: /api/v1/game-core
            pathType: Prefix
            backend:
              service:
                name: game-core
                port: { number: 8001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-end
                port: { number: 80 }
